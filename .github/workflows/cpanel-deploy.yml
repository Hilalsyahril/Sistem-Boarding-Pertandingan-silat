name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
      - master # Akan berjalan ketika Anda push ke main atau master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Pastikan versi Node.js sama dengan yang dipilih di Setup Node.js App cPanel

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Application
        run: npm run build

      - name: 📁 Prepare Deployment Files
        run: |
          mkdir -p deploy_folder
          cp -r dist deploy_folder/dist
          cp package_cpanel.json deploy_folder/package.json
          cp app_cpanel.js deploy_folder/app.js
          cp schema.sql deploy_folder/schema.sql

      - name: 🚀 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Anda harus mengatur repository secrets di GitHub:
          # Settings -> Secrets and variables -> Actions -> New repository secret
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_folder/
          # PERHATIAN: Sesuaikan server-dir dengan path folder aplikasi Node.js di cPanel Anda
          # Contoh: /silat-app/ (Jika aplikasi Anda berada di folder silat-app pada root FTP)
          server-dir: /domains/boardingsilat.mra.my.id/public_html/
