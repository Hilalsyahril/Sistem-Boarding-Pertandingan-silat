name: Deploy Node.js App via FTP

on:
  push:
    branches:
      - main # Script berjalan otomatis saat ada push ke branch 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.20.2'

    - name: Install Dependencies
      run: npm install

    - name: Build App
      run: npm run build

    - name: Prepare Deployment Folder
      run: |
        mkdir deploy_folder
        cp -r dist/* deploy_folder/
        cp package.json deploy_folder/
        cp package-lock.json deploy_folder/

    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./deploy_folder/
        server-dir: /public_html/ # PENTING: Ubah sesuai dengan nama "Application Root" di Langkah 2
