name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Build Application
      run: npm run build

    - name: Prepare Deployment Directory
      run: |
        rm -rf deploy_folder && mkdir -p deploy_folder
        # Copy built files (index.html, assets, server.cjs)
        cp -r dist/* deploy_folder/
        
        # Create app.js entry point for cPanel Phusion Passenger
        echo "require('./server.cjs');" > deploy_folder/app.js
        
        # Minimal package.json for cPanel Node.js Selector reference
        cat << 'PKG' > deploy_folder/package.json
        {
          "name": "boarding-silat-prod",
          "version": "1.0.0",
          "main": "app.js",
          "scripts": {
            "start": "node app.js"
          }
        }
        PKG

    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: domains/boardingsilat.mra.my.id/public_html/
        local-dir: ./deploy_folder/
        dangerous-clean-slate: false
        exclude: |
          **/.htaccess
          .htaccess
          **/.env
          .env
          .ftp-deploy-sync-state.json
          .cl.selector
          .cagefs
          .npm
          .php
          node_modules/**
          node_modules

