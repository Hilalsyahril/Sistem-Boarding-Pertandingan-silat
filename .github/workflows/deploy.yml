name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utama bernama master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Build Application
      run: npm run build

    - name: Prepare Deployment
      run: |
        mkdir deploy_folder
        # Salin folder hasil build (dist) yang berisi UI & Server
        cp -r dist deploy_folder/
        # Salin file package.json untuk dependensi server (mysql2, dll)
        cp package.json deploy_folder/
        # Salin file entry point untuk cPanel
        cp app.cjs deploy_folder/
        cp app.js deploy_folder/ 2>/dev/null || true

    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /domains/boardingsilat.mra.my.id/public_html/
        local-dir: ./deploy_folder/
